<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="centerGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Main Gradient for P -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Slash Gradient for D & Code / -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filter for neon dot glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle with glowing border -->
  <rect x="5" y="5" width="118" height="118" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" />
  
  <!-- Subtle inner ambient glow -->
  <rect x="7" y="7" width="114" height="114" rx="28" fill="url(#centerGlow)" />

  <!-- Subtle tech crosshair hairline -->
  <line x1="20" y1="64" x2="108" y2="64" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="64" y1="20" x2="64" y2="108" stroke="#818cf8" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Monogram P: Vertical Spine -->
  <rect x="28" y="28" width="14" height="72" rx="7" fill="url(#pGrad)" />

  <!-- Monogram P: Upper Curved Head -->
  <path d="M 38 28 H 66 C 82 28 94 40 94 54 C 94 68 82 80 66 80 H 38" fill="none" stroke="url(#pGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram D / Code slash accent -->
  <path d="M 60 58 L 96 96" fill="none" stroke="url(#slashGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Live Pulse Status Dot in top right -->
  <circle cx="100" cy="28" r="6" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="100" cy="28" r="3.5" fill="#ffffff" />
</svg>